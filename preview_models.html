<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLB 模型预览 - 土星 / 月球 / 复活太空舱 / 飞行服</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #eee; font-family: 'Microsoft YaHei', sans-serif; overflow: hidden; }
  .container { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; width: 100vw; height: 100vh; gap: 2px; background: #333; }
  .panel { background: #16213e; position: relative; overflow: hidden; cursor: grab; }
  .panel:active { cursor: grabbing; }
  .label {
    position: absolute; top: 10px; left: 10px; z-index: 10;
    background: rgba(0,0,0,0.7); padding: 6px 14px; border-radius: 6px;
    font-size: 15px; font-weight: bold; pointer-events: none;
  }
  .hint {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 10;
    background: rgba(0,0,0,0.5); padding: 4px 12px; border-radius: 4px;
    font-size: 12px; color: #aaa; pointer-events: none;
  }
</style>
</head>
<body>
<div class="container">
  <div class="panel" id="panel1"><div class="label">🪐 土星 (Saturn)</div><div class="hint">拖拽旋转 · 滚轮缩放</div></div>
  <div class="panel" id="panel2"><div class="label">🌙 月球基地 (Moon Base)</div><div class="hint">拖拽旋转 · 滚轮缩放</div></div>
  <div class="panel" id="panel3"><div class="label">💊 复活太空舱 (Revive Capsule)</div><div class="hint">拖拽旋转 · 滚轮缩放</div></div>
  <div class="panel" id="panel4"><div class="label">🛩️ 飞行服 (Flight Suit)</div><div class="hint">拖拽旋转 · 滚轮缩放</div></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const BASE = 'http://localhost:9090/';
const configs = [
  { id: 'panel1', path: BASE + 'assets/models/saturn_20260524.glb',    label: '土星' },
  { id: 'panel2', path: BASE + 'assets/models/moon_base_20260524.glb',  label: '月球基地' },
  { id: 'panel3', path: BASE + 'assets/models/item_revive_capsule.glb', label: '复活太空舱' },
  { id: 'panel4', path: BASE + 'assets/flight_suit.glb',                label: '飞行服' },
];

const loader = new GLTFLoader();

configs.forEach(cfg => {
  const panel = document.getElementById(cfg.id);
  const w = panel.clientWidth;
  const h = panel.clientHeight;

  // Renderer
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  panel.appendChild(renderer.domElement);

  // Scene
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x16213e);

  // Camera
  const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
  camera.position.set(3, 2, 5);
  camera.lookAt(0, 0, 0);

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0.5);
  scene.add(hemi);
  const key = new THREE.DirectionalLight(0xffffff, 0.8);
  key.position.set(5, 10, 5);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0x8888ff, 0.4);
  fill.position.set(-5, 0, -3);
  scene.add(fill);
  const rim = new THREE.DirectionalLight(0xff8866, 0.3);
  rim.position.set(0, -1, 5);
  scene.add(rim);

  // Controls
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.target.set(0, 0, 0);
  controls.update();

  // Load GLB
  loader.load(cfg.path,
    (gltf) => {
      const model = gltf.scene;
      // Center & auto-scale
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = 3 / maxDim;
      model.scale.setScalar(scale);
      model.position.set(-center.x * scale, -center.y * scale, -center.z * scale);
      scene.add(model);
      console.log(`✅ ${cfg.label} 加载完成 (${cfg.path})`);
    },
    (xhr) => {},
    (err) => {
      console.error(`❌ ${cfg.label} 加载失败:`, err);
      panel.querySelector('.label').textContent = `❌ ${cfg.label} 加载失败`;
      panel.querySelector('.label').style.color = '#ff6b6b';
    }
  );

  // Animate
  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  // Resize handler
  const ro = new ResizeObserver(() => {
    const nw = panel.clientWidth;
    const nh = panel.clientHeight;
    renderer.setSize(nw, nh);
    camera.aspect = nw / nh;
    camera.updateProjectionMatrix();
  });
  ro.observe(panel);
});
</script>
</body>
</html>
