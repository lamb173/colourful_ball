<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Model Viewer - Saturn</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
    model-viewer { width: 90vw; height: 90vh; }
    .info { color: #aaa; margin-top: 12px; font-size: 14px; }
    .controls { position: absolute; top: 12px; left: 12px; color: #888; font-size: 12px; }
  </style>
</head>
<body>
  <div class="controls">🖱️ 左键旋转 | 右键平移 | 滚轮缩放</div>
  <model-viewer
    src="saturn_20260524.glb"
    alt="土星3D模型"
    camera-controls
    auto-rotate
    rotation-per-second="8deg"
    shadow-intensity="1"
    exposure="1.2"
    environment-image="neutral"
    ar
  ></model-viewer>
  <div class="info">土星关卡 · 第5关 · PBR材质 · 30万面</div>
</body>
</html>
